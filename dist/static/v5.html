<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindStory Learning Assistant V5</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script>
        // Tailwind CSS 경고 억제
        if (typeof window !== 'undefined') {
            window.tailwindConfigOverride = true;
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-blue-900 to-gray-900 text-white min-h-screen p-8">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-4xl font-bold mb-4">🧠 MindStory V5</h1>
        <p class="text-gray-300 mb-8">압축률 강제 + 참고서형 구조화 + 마인드맵 + Selftest 90% 게이트 + D1 저장</p>
        
        <div class="mb-6">
            <label class="block mb-2 font-semibold">학습 자료 입력</label>
            <textarea id="inputText" class="w-full h-48 p-4 rounded-xl bg-gray-800 border border-gray-700 text-white" placeholder="분석할 텍스트를 입력하세요..."></textarea>
            <div class="text-sm text-gray-400 mt-2" id="charCount">0자</div>
        </div>

        <div class="mb-6">
            <label class="block mb-2 font-semibold">모드 선택</label>
            <div class="flex gap-2">
                <button class="mode-btn px-4 py-2 rounded-lg bg-gray-700" data-mode="brief">간단</button>
                <button class="mode-btn px-4 py-2 rounded-lg bg-blue-600" data-mode="standard">표준</button>
                <button class="mode-btn px-4 py-2 rounded-lg bg-gray-700" data-mode="detail">상세</button>
            </div>
        </div>

        <div class="mb-6">
            <label class="block mb-2 font-semibold">출력 형식</label>
            <div class="flex gap-2">
                <button class="view-btn px-4 py-2 rounded-lg bg-green-600" data-view="narrative">서술형</button>
                <button class="view-btn px-4 py-2 rounded-lg bg-gray-700" data-view="structured">구조화</button>
                <button class="view-btn px-4 py-2 rounded-lg bg-gray-700" data-view="mindmap">마인드맵</button>
                <button class="view-btn px-4 py-2 rounded-lg bg-gray-700" data-view="selftest">자가테스트</button>
            </div>
        </div>

        <div class="mb-6">
            <button id="summarizeBtn" class="px-6 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 font-bold hover:from-blue-700 hover:to-purple-700">
                요약하기
            </button>
            <button id="saveBtn" class="px-6 py-3 rounded-xl bg-green-600 font-bold hover:bg-green-700 ml-2 hidden">
                저장하기
            </button>
        </div>

        <div id="resultSection" class="hidden">
            <div class="mb-4 flex items-center justify-between">
                <h2 class="text-2xl font-bold">결과</h2>
                <button id="copyBtn" class="px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600">복사</button>
            </div>
            <div id="resultContent" class="rounded-xl p-6 bg-gray-800 border border-gray-700"></div>
            <div id="resultMeta" class="mt-4 text-sm text-gray-400"></div>
        </div>

        <div id="loadingIndicator" class="hidden mt-6">
            <div class="flex items-center gap-3">
                <div class="w-6 h-6 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                <span>처리 중...</span>
            </div>
        </div>

        <div id="errorBox" class="hidden mt-6 p-4 rounded-xl bg-red-900/50 border border-red-700">
            <div class="font-bold mb-2">오류 발생</div>
            <div id="errorText"></div>
        </div>
    </div>

    <script src="/static/ms-mindmap-svg.js"></script>
    <script src="/static/ms-learn-v5.js"></script>
    <script src="/static/v5-client.js"></script>
</body>
</html>
