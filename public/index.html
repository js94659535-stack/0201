<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindStory - 학습 요약 도우미</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
  <script src="/static/ms-mindmap-svg.js?v=5"></script>
  <script src="/static/result-ui.js?v=5"></script>
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    /* MindStory Result Rendering V2 (가독성 개선) */
    .ms-narrative { line-height: 1.65; }
    .ms-paragraph { margin: 0 0 12px 0; font-size: 14.5px; white-space: pre-wrap; }
    .ms-quote {
      margin: 10px 0 14px;
      padding: 10px 12px;
      border-left: 3px solid rgba(0,0,0,0.28);
      background: rgba(0,0,0,0.03);
      border-radius: 12px;
      white-space: pre-wrap;
    }
    .ms-structured .ms-h1 { font-size: 16px; font-weight: 700; margin: 0 0 10px 0; }
    .ms-structured .ms-h2 { font-size: 15px; font-weight: 700; margin: 14px 0 8px; }
    .ms-ul { margin: 0 0 8px 18px; padding: 0; }
    .ms-ul > li { margin: 0 0 10px 0; }
    .ms-key { font-weight: 600; margin-bottom: 6px; }
    .ms-subul { margin: 0 0 0 18px; padding: 0; opacity: 0.95; }
    .ms-subul > li { margin: 0 0 6px 0; }
    .ms-chip { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; background: rgba(128,128,128,.08); border:1px solid rgba(128,128,128,.10); margin-left:6px; opacity:.9;}
    .ms-box { border:1px solid rgba(128,128,128,.10); background: rgba(128,128,128,.04); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
    .ms-hr { height:1px; background: rgba(128,128,128,.10); border:0; margin: 14px 0; }
    .ms-q { margin: 10px 0; padding: 10px 12px; border-radius: 14px; background: rgba(128,128,128,.05); border:1px solid rgba(128,128,128,.10); }
    .ms-q .q { font-weight: 700; }
    .ms-q .a { margin-top:6px; opacity:.92; }
    .ms-mindmap-wrap { height: 560px; border-radius: 16px; border:1px solid rgba(128,128,128,.10); background: rgba(128,128,128,.03); overflow:hidden; }
  </style>
</head>
<body class="antialiased">
  <div id="app" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-4xl w-full">
      <!-- Header -->
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-gray-800 mb-2">
          <i class="fas fa-brain text-purple-600"></i>
          MindStory V5
        </h1>
        <p class="text-gray-600 text-sm">
          📝 <strong>서술형</strong> + 참고서형 구조화 + 마인드맵 + Selftest 90% 게이트 + 압축률 강제
        </p>
        <p class="text-gray-500 text-xs mt-1">
          Zero Tolerance: 원문 복사 금지 · 누적 확장 차단 · Quality Gate 강제
        </p>
      </div>

      <!-- Input Section -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          <i class="fas fa-edit"></i> 학습할 내용을 입력하세요
        </label>
        <textarea 
          id="inputText" 
          class="w-full h-48 p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent resize-none"
          placeholder="여기에 요약하고 싶은 텍스트를 입력하세요..."
        ></textarea>
        <div class="mt-2 text-sm text-gray-500">
          <span id="charCount">0</span> 자
        </div>
      </div>

      <!-- Mode Selection -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          <i class="fas fa-sliders-h"></i> 요약 모드
        </label>
        <div class="grid grid-cols-3 gap-3">
          <button class="mode-btn px-4 py-2 rounded-lg border-2 border-purple-300 hover:border-purple-500 hover:bg-purple-50 transition" data-mode="brief">
            <i class="fas fa-bolt"></i> 간단
          </button>
          <button class="mode-btn px-4 py-2 rounded-lg border-2 border-purple-500 bg-purple-50 transition" data-mode="standard">
            <i class="fas fa-balance-scale"></i> 표준
          </button>
          <button class="mode-btn px-4 py-2 rounded-lg border-2 border-purple-300 hover:border-purple-500 hover:bg-purple-50 transition" data-mode="detail">
            <i class="fas fa-microscope"></i> 상세
          </button>
        </div>
      </div>

      <!-- View Type Selection -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          <i class="fas fa-eye"></i> 보기 형식
        </label>
        <div class="grid grid-cols-4 gap-3">
          <button class="view-btn px-4 py-2 rounded-lg border-2 border-blue-500 bg-blue-50 transition text-sm" data-view="narrative">
            <i class="fas fa-book"></i> 서술형
          </button>
          <button class="view-btn px-4 py-2 rounded-lg border-2 border-blue-300 hover:border-blue-500 hover:bg-blue-50 transition text-sm" data-view="structured">
            <i class="fas fa-list"></i> 구조화
          </button>
          <button class="view-btn px-4 py-2 rounded-lg border-2 border-blue-300 hover:border-blue-500 hover:bg-blue-50 transition text-sm" data-view="mindmap">
            <i class="fas fa-project-diagram"></i> 마인드맵
          </button>
          <button class="view-btn px-4 py-2 rounded-lg border-2 border-blue-300 hover:border-blue-500 hover:bg-blue-50 transition text-sm" data-view="selftest">
            <i class="fas fa-question-circle"></i> 자가테스트
          </button>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-3 mb-6">
        <button id="summarizeBtn" class="flex-1 bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition font-medium disabled:opacity-50 disabled:cursor-not-allowed">
          <i class="fas fa-magic"></i> 요약하기
        </button>
        <button id="clearBtn" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">
          <i class="fas fa-eraser"></i> 지우기
        </button>
      </div>

      <!-- Result Section -->
      <div id="resultSection" class="hidden mt-8 p-6 bg-gray-50 rounded-lg">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-bold text-gray-800">
            <i class="fas fa-check-circle text-green-500"></i> 요약 결과
          </h2>
          <button id="copyBtn" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition text-sm">
            <i class="fas fa-copy"></i> 복사
          </button>
        </div>
        <div id="resultContent" class="prose max-w-none">
          <!-- 결과가 여기에 표시됩니다 -->
        </div>
        <div class="mt-4 text-xs text-gray-500">
          <i class="fas fa-info-circle"></i>
          <span id="resultMeta"></span>
        </div>
      </div>

      <!-- Loading Indicator -->
      <div id="loadingIndicator" class="hidden text-center py-8">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600"></div>
        <p class="mt-4 text-gray-600">요약 중입니다...</p>
      </div>

      <!-- Error Message -->
      <div id="errorMessage" class="hidden mt-4 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700">
        <i class="fas fa-exclamation-triangle"></i>
        <span id="errorText"></span>
      </div>
    </div>
  </div>

  <script>
    // Wait for all scripts to load
    window.addEventListener('DOMContentLoaded', function() {
      // State
      let currentMode = 'standard';
      let currentView = 'narrative';

    // DOM Elements
    const inputText = document.getElementById('inputText');
    const charCount = document.getElementById('charCount');
    const summarizeBtn = document.getElementById('summarizeBtn');
    const clearBtn = document.getElementById('clearBtn');
    const resultSection = document.getElementById('resultSection');
    const resultContent = document.getElementById('resultContent');
    const resultMeta = document.getElementById('resultMeta');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const copyBtn = document.getElementById('copyBtn');

    // Update character count
    inputText.addEventListener('input', () => {
      const count = inputText.value.length;
      charCount.textContent = count;
      summarizeBtn.disabled = count === 0;
    });

    // Mode selection
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => {
          b.classList.remove('border-purple-500', 'bg-purple-50');
          b.classList.add('border-purple-300');
        });
        btn.classList.remove('border-purple-300');
        btn.classList.add('border-purple-500', 'bg-purple-50');
        currentMode = btn.dataset.mode;
      });
    });

    // View selection
    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.view-btn').forEach(b => {
          b.classList.remove('border-blue-500', 'bg-blue-50');
          b.classList.add('border-blue-300');
        });
        btn.classList.remove('border-blue-300');
        btn.classList.add('border-blue-500', 'bg-blue-50');
        currentView = btn.dataset.view;
      });
    });

    // Clear button
    clearBtn.addEventListener('click', () => {
      inputText.value = '';
      charCount.textContent = '0';
      summarizeBtn.disabled = true;
      resultSection.classList.add('hidden');
      errorMessage.classList.add('hidden');
    });

    // Copy button
    copyBtn.addEventListener('click', async () => {
      const text = resultContent.innerText;
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.innerHTML = '<i class="fas fa-check"></i> 복사됨!';
        setTimeout(() => {
          copyBtn.innerHTML = '<i class="fas fa-copy"></i> 복사';
        }, 2000);
      } catch (err) {
        alert('복사에 실패했습니다.');
      }
    });

    // Show error
    function showError(message) {
      errorText.textContent = message;
      errorMessage.classList.remove('hidden');
      loadingIndicator.classList.add('hidden');
    }

    // Render result
    function renderResult(response) {
      // 🔴 [FIX] engine/mode/view는 최상위에서 읽기 (백엔드 응답 구조 반영)
      const { data, meta, engine, mode, view } = response;
      
      // 디버깅: 응답 구조 로깅
      console.log('[Response Structure]', {
        hasEngine: !!engine,
        hasMode: !!mode,
        hasView: !!view,
        engine,
        mode,
        view,
        metaEngine: meta?.engine,
        metaEngineMetaengineMetadata: meta?.engineMeta
      });
      
      let html = '';

      if (currentView === 'narrative' && data.narrative) {
        html += `<h3 class="text-xl font-bold mb-4">📘 서술형 요약</h3>`;
        // MS_renderNarrativeBetter 사용 (가독성 개선)
        if (window.MS_renderNarrativeBetter) {
          html += window.MS_renderNarrativeBetter(data.narrative);
        } else {
          html += `<div class="prose max-w-none">`;
          html += `<p class="text-gray-700 leading-relaxed whitespace-pre-wrap">${escapeHtml(data.narrative)}</p>`;
          html += `</div>`;
        }
      } else if (currentView === 'structured' && data.structured) {
        html += `<h3 class="text-xl font-bold mb-4">🧱 구조화 요약</h3>`;
        
        // DEBUG: Check what's available
        console.log('[DEBUG] structured render path:', {
          hasMS_renderStructuredBetter: !!window.MS_renderStructuredBetter,
          hasTree: !!data.structured.tree,
          structuredKeys: Object.keys(data.structured),
          structuredType: typeof data.structured
        });
        
        // Priority 1: Use tree directly (most reliable)
        if (data.structured.tree) {
          html += renderTree(data.structured.tree);
        }
        // Priority 2: Use MS_renderStructuredBetter
        else if (window.MS_renderStructuredBetter) {
          html += window.MS_renderStructuredBetter(data.structured);
        }
        // Priority 3: bullets array
        else if (typeof data.structured === 'object' && data.structured.bullets) {
          html += `<ul class="list-disc list-inside space-y-2">`;
          data.structured.bullets.forEach(b => {
            html += `<li class="text-gray-700">${escapeHtml(String(b))}</li>`;
          });
          html += `</ul>`;
        }
        // Fallback: JSON display
        else {
          console.warn('[WARN] No valid structured format, showing JSON');
          html += `<pre class="whitespace-pre-wrap text-gray-700 text-sm">${escapeHtml(JSON.stringify(data.structured, null, 2))}</pre>`;
        }
      } else if (currentView === 'mindmap' && data.mindmap) {
        html += `<h3 class="text-xl font-bold mb-4">🧠 마인드맵</h3>`;
        html += `<div id="mindmapContainer" style="height: 560px; border-radius: 16px; border:1px solid rgba(128,128,128,.10); background: rgba(128,128,128,.03); overflow:hidden;"></div>`;
        resultContent.innerHTML = html;
        // 마인드맵 SVG 렌더링 (비동기)
        setTimeout(() => {
          const container = document.getElementById('mindmapContainer');
          if (container && window.MS_renderMindmapFromEngineMindmap) {
            try {
              window.MS_renderMindmapFromEngineMindmap(container, data.mindmap, { debug: false });
            } catch (err) {
              console.error('[Mindmap] Render error:', err);
              container.innerHTML = '<div style="padding:20px; color:#ef4444;">마인드맵 렌더링 오류: ' + escapeHtml(err.message) + '</div>';
            }
          } else {
            container.innerHTML = '<div style="padding:20px; color:#ef4444;">MS_renderMindmapFromEngineMindmap 함수가 없습니다.</div>';
          }
        }, 100);
        // 🔴 [FIX] engine은 최상위 response.engine에서 읽기
        resultMeta.textContent = `엔진: ${engine || meta?.engineMeta || 'unknown'} | 모드: ${mode || 'unknown'} | 뷰: ${view || 'unknown'} | 캐시: ${meta?.cached ? 'HIT' : 'MISS'} | 시간: ${meta?.elapsedMs || 0}ms`;
        resultSection.classList.remove('hidden');
        return;
      } else if (currentView === 'selftest' && data.selftest) {
        html += `<h3 class="text-xl font-bold mb-4">자가 테스트</h3>`;
        html += `<div class="space-y-4">`;
        data.selftest.forEach((q, i) => {
          html += `<div class="p-4 bg-white rounded-lg border border-gray-200">`;
          html += `<p class="font-medium mb-2">Q${i + 1}. ${q.q}</p>`;
          html += `<details class="mt-2">`;
          html += `<summary class="cursor-pointer text-sm text-blue-600 hover:text-blue-800">답변 보기</summary>`;
          html += `<p class="text-sm text-gray-700 mt-2">A: ${q.a}</p>`;
          if (q.hint) {
            html += `<p class="text-xs text-gray-500 mt-1">힌트: ${q.hint}</p>`;
          }
          html += `</details>`;
          html += `</div>`;
        });
        html += `</div>`;
      }

      resultContent.innerHTML = html;
      // 🔴 [FIX] engine은 최상위에서 읽기
      resultMeta.textContent = `엔진: ${engine || meta?.engineMeta || 'unknown'} | 모드: ${mode || 'unknown'} | 뷰: ${view || 'unknown'} | 캐시: ${meta?.cached ? 'HIT' : 'MISS'} | 시간: ${meta?.elapsedMs || 0}ms`;
      resultSection.classList.remove('hidden');
    }

    // HTML 이스케이프
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return String(text || '').replace(/[&<>"']/g, m => map[m]);
    }

    // Render Tree (재귀)
    function renderTree(node, depth = 0) {
      if (!node) return '';
      
      const indent = depth * 20;
      let html = `<div style="margin-left: ${indent}px; margin-top: 8px;">`;
      
      // 노드 제목
      if (node.title) {
        html += `<div class="font-semibold text-gray-800 mb-1">${escapeHtml(node.title)}</div>`;
      }
      
      // pack (키워드)
      if (node.pack) {
        const packArr = Array.isArray(node.pack) ? node.pack : [node.pack];
        html += `<div class="text-xs text-purple-600 mb-1">`;
        html += packArr.map(p => `<span class="inline-block px-2 py-1 bg-purple-100 rounded mr-1">${escapeHtml(p)}</span>`).join('');
        html += `</div>`;
      }
      
      // explain (설명)
      if (node.explain) {
        html += `<div class="text-sm text-gray-600 mb-2">${escapeHtml(node.explain)}</div>`;
      }
      
      // 자식 노드
      if (node.children && node.children.length > 0) {
        node.children.forEach(child => {
          html += renderTree(child, depth + 1);
        });
      }
      
      html += `</div>`;
      return html;
    }

    // Summarize button
    summarizeBtn.addEventListener('click', async () => {
      const text = inputText.value.trim();
      if (!text) return;

      // Hide previous results and errors
      resultSection.classList.add('hidden');
      errorMessage.classList.add('hidden');
      loadingIndicator.classList.remove('hidden');

      try {
        const response = await fetch('/api/engine', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text,
            mode: currentMode,
            viewType: currentView,
            userId: 'web_user'
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const result = await response.json();

        if (!result.ok) {
          // 🔴 FIX: error가 객체일 때 JSON.stringify 사용
          const errorMsg = result.error 
            ? (typeof result.error === 'object' 
                ? `${result.error.code || 'ERROR'}: ${result.error.message || JSON.stringify(result.error)}`
                : result.error)
            : 'Unknown error';
          throw new Error(errorMsg);
        }

        loadingIndicator.classList.add('hidden');
        renderResult(result);
      } catch (error) {
        console.error('Error:', error);
        showError(error.message || '요약 중 오류가 발생했습니다.');
      }
    });

    // Initialize
    summarizeBtn.disabled = true;
    }); // End DOMContentLoaded
  </script>
</body>
</html>
